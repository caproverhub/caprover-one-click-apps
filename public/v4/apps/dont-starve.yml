captainVersion: 4

caproverOneClickApp:
  instructions:
    start: "Ce modèle installe un serveur dédié complet Don't Starve Together subdivisé en 2 instances (Master pour la surface et Caves pour le sous-sol)."
    end: "Le déploiement est lancé ! ATTENTION : Vous devez impérativement ouvrir les ports UDP configurés (ex: 10999, 10888, 11000, 27017, 27018, 8767, 8768) sur le pare-feu externe de votre machine hôte pour permettre aux joueurs de se connecter."
  variables:
    - id: '$$cap_dst_token'
      label: "Klei Cluster Token"
      description: "Le jeton obligatoire obtenu via le portail officiel Klei."
      validRegex: "/.{5,}/"
    - id: '$$cap_dst_server_name'
      label: "Nom du Serveur"
      defaultValue: "Mon Serveur CapRover DST"
      description: "Le nom affiché dans la liste des serveurs publics."
    - id: '$$cap_dst_password'
      label: "Mot de passe"
      defaultValue: ""
      description: "Laissez vide si vous souhaitez un accès public."
    - id: '$$cap_dst_max_players'
      label: "Joueurs max"
      defaultValue: "6"
      description: "Nombre de slots disponibles."
    - id: '$$cap_dst_game_mode'
      label: "Mode de jeu"
      defaultValue: "survival"
      description: "Options valides : survival, endless, wilderness."
  description: "Serveur dédié Don't Starve Together avec gestion simultanée de la surface et des grottes via l'image dockhippie/dst."

services:
  $$cap_appname-master:
    image: webhippie/dst:latest
    containerHttpPort: 10999
    notExposeAsWebApp: true
    restart: always
    environment:
      DST_CLUSTER_TOKEN: $$cap_dst_token
      DST_NETWORK_CLUSTER_NAME: $$cap_dst_server_name
      DST_NETWORK_CLUSTER_PASSWORD: $$cap_dst_password
      DST_GAMEPLAY_MAX_PLAYERS: $$cap_dst_max_players
      DST_GAMEPLAY_GAME_MODE: $$cap_dst_game_mode
      DST_GAMEPLAY_PAUSE_WHEN_EMPTY: "true"
      DST_SHARD_ENABLED: "true"
      DST_SHARD_NAME: "Master"
      DST_SHARD_ID: "1"
      DST_SHARD_IS_MASTER: "true"
      DST_SHARD_BIND_IP: "0.0.0.0"
      DST_NETWORK_SERVER_PORT: "10999"
      DST_SHARD_MASTER_PORT: "10888"
      DST_STEAM_MASTER_SERVER_PORT: "27017"
      DST_STEAM_AUTHENTICATION_PORT: "8767"
    volumes:
      - $$cap_appname-shared-data:/var/lib/game
    ports:
      - "10999:10999"
      - "10888:10888"
      - "27017:27017"
      - "8767:8767"
    caproverExtra:
      notExposeAsWebApp: 'true'

  # --- SERVEUR GROTTES ---
  $$cap_appname-caves:
    image: webhippie/dst:latest
    containerHttpPort: 11000
    notExposeAsWebApp: true
    restart: always
    environment:
      DST_CLUSTER_TOKEN: $$cap_dst_token
      DST_SHARD_ENABLED: "true"
      DST_SHARD_NAME: "Caves"
      DST_SHARD_ID: "2"
      DST_SHARD_IS_MASTER: "false"
      DST_SHARD_MASTER_IP: $$cap_appname-master
      DST_SHARD_MASTER_PORT: "10888"
      DST_NETWORK_SERVER_PORT: "11000"
      DST_STEAM_MASTER_SERVER_PORT: "27018"
      DST_STEAM_AUTHENTICATION_PORT: "8768"
      DST_OVERRIDE_PRESET: "Caves"
    volumes:
      - $$cap_appname-shared-data:/var/lib/game
    ports:
      - "11000:11000"
      - "27018:27018"
      - "8768:8768"
    caproverExtra:
      notExposeAsWebApp: 'true'
